<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MindSync | Psixologik Tahlil Platformasi</title>
    <meta name="description" content="Talabalar ijtimoiy-psixologik portretini yaratish va tahlil qilish uchun premium platforma.">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2103/2103633.png">
    <link rel="stylesheet" href="css/main.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- PapaParse for CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

</head>

<body>
    <div id="app">
        <!-- Navigation -->
        <nav class="navbar" style="display:none">
            <div class="nav-container">
                <div class="logo" id="nav-logo">
                    <span class="logo-icon">✨</span>
                    <span class="logo-text">PsyBoard</span>
                </div>
                <div class="nav-links" id="nav-links"></div>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main id="main-content">
            <div class="loader-container">
                <div class="loader"></div>
            </div>
        </main>

        <!-- Notification Toast -->
        <div id="toast-container"></div>
    </div>

    <!-- Firebase Scripts -->
    <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
        "firebase/storage": "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js"
      }
    }
    </script>

    <!-- App Logic -->
    <script type="module" src="js/app.js"></script>
</body>

</html>
